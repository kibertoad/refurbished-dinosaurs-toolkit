name: Continuous integration
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/Verify-Repository.ps1
      # Before the engine tests: one of them runs the reader's command line, which needs its packages.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install './packages/scientific-method-engine[test]'
      - name: Engine tests
        working-directory: packages/scientific-method-engine
        run: python -B -m unittest discover -s tests -p 'test*.py'
      - run: python -m pip install './packages/disc-archiver'
      # The window's tests that need a display run under Xvfb; the rest run without one.
      - name: Disc archiver tests
        working-directory: packages/disc-archiver
        run: xvfb-run -a python -B -m unittest discover -s tests -p 'test*.py'
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm exec tsc -p tools/tsconfig.json
      - run: pnpm run test
      - run: node --test "tools/release/*.test.ts"
      # Builds the npm packages and packs them as they would be published.
      - run: pnpm run build
      - run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore packages/dotnet/RefurbishedDinosaurs.slnx
      - run: dotnet build packages/dotnet/RefurbishedDinosaurs.slnx --no-restore -v minimal
      - run: dotnet test --project packages/dotnet/RefurbishedDinosaurs.Core.Tests/RefurbishedDinosaurs.Core.Tests.csproj --no-restore --no-progress -v minimal
      - run: dotnet pack packages/dotnet/RefurbishedDinosaurs.slnx --no-build -c Debug --output artifacts
  # Builds the standalone Disc Archiver download (no Python needed) on each platform players use,
  # with the pinned redumper, and starts both executables. The zips are kept for a week for trying.
  disc-archiver-bundle:
    name: disc-archiver bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/disc-archiver -r packages/disc-archiver/packaging/requirements.txt
      - name: Build
        shell: bash
        working-directory: packages/disc-archiver
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a); else run=(); fi
          "${run[@]}" python packaging/build_bundle.py --out "$RUNNER_TEMP/bundle"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disc-archiver-${{ matrix.os }}
          path: ${{ runner.temp }}/bundle/*.zip
          retention-days: 7
  # Runs the check-documentation action as a restoration would, against the test fixture, so the
  # Kaitai Struct compiler install and the .ksy compilation run on both runner platforms.
  documentation-action:
    name: check-documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/check-documentation
        with:
          root: packages/standard-checker/test/valid
