name: Continuous integration
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  # Decides which of the jobs below this pull request needs. tools/ci/changes.ts maps paths to
  # areas; a manual run, or a change to this workflow, to that script or to tools/lib/, turns every
  # area on.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.areas.outputs.typescript }}
      engine: ${{ steps.areas.outputs.engine }}
      disc-archiver: ${{ steps.areas.outputs.discArchiver }}
      dotnet: ${{ steps.areas.outputs.dotnet }}
      documentation-action: ${{ steps.areas.outputs.documentationAction }}
      software-opengl: ${{ steps.areas.outputs.softwareOpenGl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # A manual run has no pull request, so both variables are empty and the script gets no
      # arguments, which turns every area on.
      - id: areas
        run: node tools/ci/changes.ts $BASE_SHA $HEAD_SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # The repository policy covers every file, so it runs on every pull request.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/Verify-Repository.ps1
  typescript:
    name: TypeScript and engine
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the engine tests: one of them runs the reader's command line, which needs its packages.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The reader's bridge tests run the engine, so it is installed whenever this job runs.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install './packages/scientific-method-engine[test]'
      - name: Engine tests
        if: needs.changes.outputs.engine == 'true'
        working-directory: packages/scientific-method-engine
        run: python -B -m unittest discover -s tests -p 'test*.py'
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm exec tsc -p tools/tsconfig.json
      - run: pnpm run test
      # The tools' and composite actions' tests. tools/ci/changes.ts builds the globs from the area
      # rules that turn this job on.
      - name: Tool and composite action tests
        run: node tools/ci/run-tests.ts
      # Builds the npm packages and packs them as they would be published.
      - run: pnpm run build
      - run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/npm"
  disc-archiver:
    name: disc-archiver tests
    needs: changes
    if: needs.changes.outputs.disc-archiver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install './packages/disc-archiver'
      # The window's tests that need a display run under Xvfb; the rest run without one.
      - name: Disc archiver tests
        working-directory: packages/disc-archiver
        run: xvfb-run -a python -B -m unittest discover -s tests -p 'test*.py'
  dotnet:
    name: .NET
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore packages/dotnet/RefurbishedDinosaurs.slnx
      - run: dotnet build packages/dotnet/RefurbishedDinosaurs.slnx --no-restore -v minimal
      - run: dotnet test --project packages/dotnet/RefurbishedDinosaurs.Core.Tests/RefurbishedDinosaurs.Core.Tests.csproj --no-restore --no-progress -v minimal
      - run: dotnet pack packages/dotnet/RefurbishedDinosaurs.slnx --no-build -c Debug --output artifacts
  # Builds the standalone Disc Archiver download (no Python needed) on each platform players use,
  # with the pinned redumper, and starts both executables. The zips are kept for a week for trying.
  disc-archiver-bundle:
    name: disc-archiver bundle (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.disc-archiver == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/disc-archiver -r packages/disc-archiver/packaging/requirements.txt
      - name: Build
        shell: bash
        working-directory: packages/disc-archiver
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a); else run=(); fi
          "${run[@]}" python packaging/build_bundle.py --out "$RUNNER_TEMP/bundle"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disc-archiver-${{ matrix.os }}
          path: ${{ runner.temp }}/bundle/*.zip
          retention-days: 7
  # Runs the check-documentation action as a restoration would, against the test fixture, so the
  # Kaitai Struct compiler install and the .ksy compilation run on both runner platforms.
  documentation-action:
    name: check-documentation (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.documentation-action == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/check-documentation
        with:
          root: packages/standard-checker/test/valid

  software-opengl-action:
    name: Software OpenGL action
    needs: changes
    if: needs.changes.outputs.software-opengl == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-software-opengl
        id: software-gl
      # Loads the driver the way docs/actions.md tells hosts to, so a Mesa update that adds a
      # library outside the staged directory, or stages the wrong architecture, fails here.
      - name: Load the staged driver
        shell: pwsh
        env:
          SOFTWARE_GL_DRIVER: ${{ steps.software-gl.outputs.driver-path }}
          SOFTWARE_GL_DIRECTORY: ${{ steps.software-gl.outputs.directory }}
        run: |
          if (-not (Test-Path -LiteralPath $env:SOFTWARE_GL_DRIVER -PathType Leaf)) { throw 'Driver is missing.' }
          if (-not $env:SOFTWARE_GL_DRIVER.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase)) { throw 'Driver escaped runner temp.' }
          if ((Split-Path -Parent $env:SOFTWARE_GL_DRIVER) -ne $env:SOFTWARE_GL_DIRECTORY) { throw 'Driver is not in the reported directory.' }
          $env:PATH = "$env:SOFTWARE_GL_DIRECTORY;$env:PATH"
          Add-Type -Namespace Native -Name Loader -MemberDefinition @'
          [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)] public static extern IntPtr LoadLibraryW(string path);
          [DllImport("kernel32", CharSet = CharSet.Ansi)] public static extern IntPtr GetProcAddress(IntPtr module, string name);
          '@
          $module = [Native.Loader]::LoadLibraryW($env:SOFTWARE_GL_DRIVER)
          if ($module -eq [IntPtr]::Zero) { throw "The driver did not load: Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())." }
          if ([Native.Loader]::GetProcAddress($module, 'wglCreateContext') -eq [IntPtr]::Zero) { throw 'The driver exports no wglCreateContext.' }
