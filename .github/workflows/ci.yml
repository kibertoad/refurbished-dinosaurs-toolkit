name: Continuous integration
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/Verify-Repository.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - run: dotnet restore Toad.DiscoveryCenter.slnx
      - run: dotnet build Toad.DiscoveryCenter.slnx --no-restore -v minimal
      - run: dotnet test --project tests/Toad.Discovery.Core.Tests/Toad.Discovery.Core.Tests.csproj --no-restore --no-progress -v minimal
      - run: dotnet pack src/Toad.Discovery.Core/Toad.Discovery.Core.csproj --no-build -c Debug --output artifacts
