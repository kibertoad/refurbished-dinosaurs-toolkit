name: Continuous integration
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/Verify-Repository.ps1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/scientific-method-engine
      - name: Engine tests
        working-directory: packages/scientific-method-engine
        run: python -B -m unittest discover -s tests -p 'test*.py'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm exec tsc -p tools/tsconfig.json
      - run: pnpm run test
      - run: node --test "tools/release/*.test.ts"
      # Packs the npm packages as they would be published, which builds them.
      - run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore packages/dotnet/Toad.DiscoveryCenter.slnx
      - run: dotnet build packages/dotnet/Toad.DiscoveryCenter.slnx --no-restore -v minimal
      - run: dotnet test --project packages/dotnet/Toad.Discovery.Core.Tests/Toad.Discovery.Core.Tests.csproj --no-restore --no-progress -v minimal
      - run: dotnet pack packages/dotnet/Toad.DiscoveryCenter.slnx --no-build -c Debug --output artifacts
  # Runs the check-documentation action as a restoration would, against the test fixture, so the
  # Kaitai Struct compiler install and the .ksy compilation run on both runner platforms.
  documentation-action:
    name: check-documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/check-documentation
        with:
          root: packages/standard-checker/test/valid
