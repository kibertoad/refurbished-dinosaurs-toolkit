name: Release label

# A pull request that changes a label-versioned package (the PyPI packages or the NuGet libraries)
# must carry exactly one of release:major, release:minor, release:patch or release:skip. The
# package paths are listed in tools/release/plan.ts. npm packages use changesets instead.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

# Opening a pull request with a label fires `opened` and `labeled` together. Only the newest run per
# pull request is kept.
concurrency:
  group: release-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # The event payload holds the labels as they were when the event fired, and a re-run reuses
      # that payload. Read the labels the pull request has now.
      - id: labels
        # A separate assignment lets a failed API call fail the step instead of passing an empty list.
        run: |
          names=$(gh api "repos/$REPO/pulls/$PR" --jq '[.labels[].name]')
          echo "names=$names" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
      - run: node tools/release/plan.ts check "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ steps.labels.outputs.names }}
