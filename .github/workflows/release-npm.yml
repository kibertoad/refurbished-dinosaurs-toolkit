name: Release npm packages

# A run with pending changesets applies them to the package versions and changelogs, pushes that
# commit to main and dispatches itself. The dispatched run finds no changesets and publishes every
# package whose version is not on npm yet, through npm trusted publishing (OIDC) with provenance.
# No npm token is stored. There is no release pull request: the pull_request checks it started
# failed at startup, because the workflow merged it seconds after opening it.
on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
      - packages/executable-reader/**
      - packages/standard-checker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  repository_dispatch:
    types:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy the licence into the packages
        run: |
          cp LICENSE packages/executable-reader/LICENSE
          cp LICENSE packages/standard-checker/LICENSE

      # changeset version exits 1 when nothing is pending, so look for changeset files first.
      - name: Version pending changesets
        id: version
        run: |
          if ! find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm changeset version
          git add -A .changeset packages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update versions"
          # A push made with this token starts no workflow, so the run dispatches the publish itself.
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
          gh api --method POST "/repos/$REPO/dispatches" -f 'event_type=release'
          echo "versioned=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Publish
        if: steps.version.outputs.versioned == 'false'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm run ci:publish
