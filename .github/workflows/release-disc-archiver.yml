name: Release disc archiver

# When a pull request that changed packages/disc-archiver merges with a release:major,
# release:minor or release:patch label, publishes the next version to PyPI through trusted
# publishing (OIDC) and creates the dinorefurb-disc-archiver@<version> tag and GitHub release.
# The version comes from the latest such tag plus the largest bump among the pull requests merged
# since that tag.
on:
  push:
    branches:
      - main
    paths:
      - packages/disc-archiver/**

# One release at a time. GitHub replaces a pending run when another is queued, which loses nothing:
# the plan covers every pull request merged since the latest release tag, not only the one that
# started the run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    # The plan may wait up to three minutes for GitHub to link a fresh merge to its pull request.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - id: plan
        run: node tools/release/plan.ts release dinorefurb-disc-archiver "$AFTER"
        env:
          AFTER: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set the version and licence
        run: |
          node tools/release/plan.ts set-version packages/disc-archiver/pyproject.toml "$VERSION"
          cp LICENSE packages/disc-archiver/LICENSE
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - name: Test
        working-directory: packages/disc-archiver
        run: uv run --isolated --with-editable . python -B -m unittest discover -s tests -p 'test*.py'
      - name: Build
        run: uv build packages/disc-archiver --out-dir dist
      # Fails when PyPI already has this version with files that differ from this build, which
      # happens when another commit was released as this version and its tag was never created.
      # The builds are reproducible, so a rerun of this commit passes.
      - name: Check the version on PyPI
        run: node tools/release/plan.ts check-published dinorefurb-disc-archiver "$VERSION" dist
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # A rerun after a failed release step finds this build's files already uploaded,
          # which the check above has compared byte for byte.
          skip-existing: true
      - name: Tag and create the GitHub release
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}

  # Attaches the standalone downloads (no Python needed, with the pinned redumper) to the release
  # the publish job created.
  bundles:
    needs: [plan, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Set the version
        shell: bash
        run: node tools/release/plan.ts set-version packages/disc-archiver/pyproject.toml "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - run: python -m pip install ./packages/disc-archiver -r packages/disc-archiver/packaging/requirements.txt
      - name: Build
        shell: bash
        working-directory: packages/disc-archiver
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a); else run=(); fi
          "${run[@]}" python packaging/build_bundle.py --out "$RUNNER_TEMP/bundle" --version "$VERSION"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
      - name: Attach to the release
        shell: bash
        run: gh release upload "$TAG" "$RUNNER_TEMP"/bundle/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
