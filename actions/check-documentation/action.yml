name: Check documentation standard
description: Checks spec/, parity/ and deviations/ against version 1 of the documentation standard.
inputs:
  root:
    description: Workspace-relative path of the repository to check.
    required: false
    default: "."
  code:
    description: Comma-separated directories whose files may cite spec and deviation IDs and hold PLACEHOLDER comments.
    required: false
    default: src,tests,tools
  references:
    description: Comma-separated directories whose files may cite spec and deviation IDs but whose PLACEHOLDER comments do not count.
    required: false
    default: ""
  images:
    description: Comma-separated half-open address ranges of the original's flat 32-bit images, such as 0x00400000..0x004C9000. A 0x value inside one that a code comment gives must be recorded in an entry the comment cites. Empty checks only fn_ and g_ names.
    required: false
    default: ""
  max-range:
    description: The largest address range, in bytes, by which an entry records an address. Empty uses 0x10000.
    required: false
    default: ""
  data-dirs:
    description: Comma-separated top-level directories of the original's data. Empty derives them from the build entries.
    required: false
    default: ""
  base:
    description: Ref whose spec IDs, areas and deviations must still exist. Empty uses where HEAD forked from origin/$GITHUB_BASE_REF or origin/main. On a pull request the action fetches the base branch with enough history for that, and fails when the fork point still does not resolve; elsewhere the result line names the comparison as skipped.
    required: false
    default: ""
  kaitai-version:
    description: Kaitai Struct compiler release to install for compiling spec/formats/*.ksy. Empty skips the install, as does a root with no .ksy file.
    required: false
    default: "0.11"
  java-version:
    description: Java version to install for the compiler. Empty uses the runner's Java.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Look for Kaitai definitions
      id: ksy
      shell: bash
      env:
        DOC_ROOT: ${{ inputs.root }}
      run: |
        # find, unlike a glob, also matches names that start with a dot, as the checker does.
        if [ -n "$(find "$DOC_ROOT/spec/formats" -maxdepth 1 -name '*.ksy' 2> /dev/null | head -n 1)" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Java
      if: inputs.kaitai-version != '' && inputs.java-version != '' && steps.ksy.outputs.found == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - name: Cache the Kaitai Struct compiler download
      if: inputs.kaitai-version != '' && steps.ksy.outputs.found == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/kaitai-struct-compiler-${{ inputs.kaitai-version }}.zip
        key: kaitai-struct-compiler-${{ inputs.kaitai-version }}-${{ runner.os }}
    - name: Install verified Kaitai Struct compiler
      if: inputs.kaitai-version != '' && steps.ksy.outputs.found == 'true'
      shell: bash
      env:
        KSC_VERSION: ${{ inputs.kaitai-version }}
      run: bash "$GITHUB_ACTION_PATH/../setup-kaitai/install.sh"
    # Installing Node changes PATH for the caller's later steps too, so keep the caller's Node when
    # it already runs TypeScript (22.18 and later strip types by default).
    - name: Look for a Node that runs TypeScript
      id: node
      shell: bash
      run: |
        if command -v node > /dev/null && node -e 'process.exit(process.features.typescript ? 0 : 1)' 2> /dev/null; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node
      if: steps.node.outputs.ready != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
    - name: Check documentation
      shell: bash
      env:
        DOC_ROOT: ${{ inputs.root }}
        DOC_CODE: ${{ inputs.code }}
        DOC_REFERENCES: ${{ inputs.references }}
        DOC_IMAGES: ${{ inputs.images }}
        DOC_MAX_RANGE: ${{ inputs.max-range }}
        DOC_DATA_DIRS: ${{ inputs.data-dirs }}
        DOC_BASE: ${{ inputs.base }}
        # The compiler was installed above, so a compiler the check cannot find is a failure. The
        # install exports KSC, which the check takes without running it, so today this guards
        # against an install that stops setting KSC; a KSC that does not run fails as a compile error.
        DOC_REQUIRE_KSC: ${{ inputs.kaitai-version != '' && steps.ksy.outputs.found == 'true' }}
      # On a pull request with no base input, check.sh fetches the base branch and passes
      # --require-base, so a comparison with the base branch that cannot run fails the check.
      run: bash "$GITHUB_ACTION_PATH/check.sh"
