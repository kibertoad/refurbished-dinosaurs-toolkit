name: Set up software OpenGL
description: Provision checksum-verified x64 Mesa for Windows graphics smoke tests outside build outputs.
outputs:
  driver-path:
    description: Absolute path to the provisioned opengl32.dll.
    value: ${{ steps.install.outputs.driver-path }}
runs:
  using: composite
  steps:
    - name: Install verified software OpenGL
      id: install
      shell: pwsh
      env:
        TOOLKIT_ACTION_PATH: ${{ github.action_path }}
      run: |
        if (-not $IsWindows) { throw 'Software OpenGL setup requires a Windows runner.' }
        $destination = Join-Path $env:RUNNER_TEMP ('software-opengl-' + [Guid]::NewGuid().ToString('N'))
        $driver = & (Join-Path $env:TOOLKIT_ACTION_PATH 'install.ps1') -DestinationPath $destination
        "driver-path=$driver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
